[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "telem"
version = "0.16.9"
description = "GoPro video telemetry overlay application"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "fitparse>=1.2",
    "orjson>=3.9",
    "python-mpv>=1.0",
    "pyopencl>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

tools = [
    "py7zr>=0.20",
]

[project.scripts]
telem = "src.gui.qt.application:main"

[project.urls]
Homepage = "https://github.com/adramad/telem"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]